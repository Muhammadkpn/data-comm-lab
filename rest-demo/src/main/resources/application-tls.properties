# Profile `tls`: HTTPS + HTTP/2 (negosiasi lewat ALPN saat TLS handshake).
# Buat sertifikat self-signed dulu: scripts/gen-dev-cert.sh
# Jalankan: mvn -pl rest-demo spring-boot:run -Dspring-boot.run.profiles=tls
server.port=8443
server.ssl.enabled=true
# Path relatif terhadap folder rest-demo (working directory `mvn -pl rest-demo spring-boot:run`).
server.ssl.key-store=file:../.certs/dev-keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=changeit
server.ssl.key-alias=data-comm-lab
