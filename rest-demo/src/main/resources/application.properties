server.port=8080
spring.main.banner-mode=off

# HTTP/2 tanpa TLS (h2c). Client HTTP/1.1 biasa tetap dilayani seperti sebelumnya;
# client yang mendukung bisa upgrade (Upgrade: h2c) atau langsung bicara HTTP/2
# (curl --http2-prior-knowledge). Browser hanya mau HTTP/2 lewat TLS -- lihat profile `tls`.
server.http2.enabled=true
