server.port=8082
spring.main.banner-mode=off

# Secret HMAC untuk HS256 (minimal 32 byte). HANYA untuk demo lokal -- di production
# ambil dari secret manager / environment variable, jangan di-commit ke repo.
auth.jwt.secret=demo-only-secret-change-me-0123456789abcdef
# Access token sengaja pendek (60 detik) supaya efek kedaluwarsa bisa dicoba.
# Production umumnya 5-15 menit, refresh token hitungan hari.
auth.jwt.access-ttl-seconds=60

# Supaya body error menyertakan pesan (untuk belajar). Matikan di production.
server.error.include-message=always
