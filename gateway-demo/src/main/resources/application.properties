server.port=8084
spring.main.banner-mode=off

# ==== ROUTING: prefix publik -> URL upstream ====
# Client hanya mengenal gateway (satu host, satu kontrak). Lokasi & struktur service
# di belakangnya boleh berubah tanpa client tahu.
gateway.routes[/api/transfers]=http://localhost:8080/v2/transfers
gateway.routes[/api/accounts]=http://localhost:8080/v2/accounts
gateway.routes[/api/realtime]=http://localhost:8083/transfers
# Upstream tiruan di gateway ini sendiri, supaya demo bisa jalan tanpa service lain.
gateway.routes[/api/echo]=http://localhost:8084/_mock/echo
gateway.routes[/api/slow]=http://localhost:8084/_mock/slow
# Port 1 sengaja tidak ada yang listen -> demo 502 Bad Gateway.
gateway.routes[/api/down]=http://localhost:1/nothing

gateway.connect-timeout-ms=1000
gateway.read-timeout-ms=2000
