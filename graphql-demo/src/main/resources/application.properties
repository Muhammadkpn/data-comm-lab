server.port=8081

# GraphiQL: UI in-browser untuk mencoba query/mutation manual tanpa perlu
# Postman/curl. Diaktifkan eksplisit di sini karena default Spring Boot
# mematikannya (production biasanya pakai Playground/Apollo Studio eksternal).
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql

# Catatan (BUKAN diimplementasikan di demo ini): di production, endpoint
# /graphql butuh proteksi tambahan yang tidak dibutuhkan REST dengan
# banyak endpoint terpisah -- karena SEMUA operasi lewat satu pintu ini:
#   - Authentication/authorization per field/operation
#   - Rate limiting per client
#   - Query complexity & depth limiting (supaya client tidak bisa kirim
#     query bersarang yang sangat dalam/lebar dan membebani server)
#   - Persisted queries (whitelist query yang boleh dieksekusi)
